# Copy this file to config.yaml and edit locally.
# Kill switch: enabled: false, or include "bypass jev" in the request state.
enabled: true
# openjev (default): public HTTP API with OPENJEV_API_KEY
# typesafe (optional): official SDK with TYPESAFE_API_KEY
provider: openjev
# Omit model to use openjev or jev-latest for the selected provider.
# model: openjev

# shadow logs advice; active requires the Grok Bot skill to honor route.action.
mode: shadow  # shadow | active

thresholds:
  min_choice_confidence: 0.55
  reuse_min: 0.65
  subagent_min: 0.75

limits:
  max_browser_sources: 5
  max_retries_same_error: 1

logging:
  path: logs/runs.jsonl
